services:
  - type: web
    name: devforge-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: COOKIE_SECURE
        value: "1"
      - key: MAIL_PROVIDER
        value: appscript
      - key: ADMIN_EMAILS
        value: loigi2704@gmail.com,luigi.benicio@gmail.com
      - key: APP_TZ
        value: America/Sao_Paulo
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: devforge-private
      - key: GOOGLE_MAIL_URL
        value: https://script.google.com/macros/s/AKfycbxxUbv0jnuhPJtw7c32xnQxNo8yDf5KLJHywrVXk-FC4Q8EaV5aZ81Z4n5FPwe2DWEGpw/exec
      - key: DEVFORGE_MAIL_TOKEN
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
