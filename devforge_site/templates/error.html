{% extends 'base.html' %}
{% block title %}Erro {{ error_code }} · {{ site_name }}{% endblock %}
{% block content %}<section class="empty-state error-state"><div class="empty-symbol">!</div><div class="overline">ERRO {{ error_code }}</div><h1>Algo não saiu como planejado.</h1><p>{{ error_message }}</p><a href="{{ url_for('home') }}" class="btn btn-primary">Ir para o início ↗</a></section>{% endblock %}
